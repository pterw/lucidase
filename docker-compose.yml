services:
  # Lucidase Web Application
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: lucidase_web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    networks:
      - genome-net

networks:
  genome-net:
    driver: bridge
