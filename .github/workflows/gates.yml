name: Gates

# Runs the five gate commands of CLAUDE.md ("Gates (all five, in order)") on every
# pull request and on pushes to main, so a green run means the same as a green local run.
# Two required jobs run in parallel: `checks` (the fast gates) and `e2e` (the browser suite).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAILWIND_SHA256: 7d24f7fa191d2193b78cd5f5a42a6093e14409521908529f42d80b11fde1f1d4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python packages
        run: pip install -r requirements-ci.txt

      - name: Read the Tailwind pin
        id: tailwind-pin
        run: echo "short=${TAILWIND_SHA256:0:12}" >> "$GITHUB_OUTPUT"

      - name: Cache the Tailwind CLI
        id: tailwind-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tailwindcss
          key: tailwind-3.4.17-linux-x64-${{ steps.tailwind-pin.outputs.short }}

      - name: Download the Tailwind CLI
        if: steps.tailwind-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/tailwindcss" \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          echo "$TAILWIND_SHA256  $RUNNER_TEMP/tailwindcss" | sha256sum --check --strict -

      - name: Export TAILWIND_CLI
        run: |
          chmod +x "$RUNNER_TEMP/tailwindcss"
          echo "TAILWIND_CLI=$RUNNER_TEMP/tailwindcss" >> "$GITHUB_ENV"

      - name: Unit tests (pytest)
        run: python -m pytest tests -q -p no:cacheprovider --ignore=tests/e2e

      - name: Node tests
        run: node --test --test-reporter=spec "web/tests/**/*.test.mjs"

      - name: Verify knowledge base
        run: python tools/build_canonical_kb.py --verify-only

      - name: Check vendored CSS
        run: python tools/check_vendored_css.py

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Python packages
        run: pip install -r requirements-ci.txt

      - name: Read the Playwright version
        id: playwright
        run: |
          version=$(grep -i '^playwright==' requirements-ci.txt | cut -d= -f3 || true)
          if [ -z "$version" ]; then
            echo "requirements-ci.txt has no playwright== pin" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: End-to-end tests
        timeout-minutes: 15
        run: python -m pytest tests/e2e -q -p no:cacheprovider
